tags:
  - Custom Roles
operationId: get-account-custom-roles
summary: List all custom roles in an account
description: Get all custom role definitions in an account, sorted by name and ID
security:
  - userBearerAuth: []
  - userApiKey: []
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          type: array
          description: 'Array of all custom role definitions'
          items:
            $ref: '#/components/schemas/custom_role'
  '403':
    description: Access denied
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
