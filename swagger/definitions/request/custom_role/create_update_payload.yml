type: object
required:
  - name
  - description
  - permissions
properties:
  name:
    type: string
    minLength: 2
    maxLength: 100
    description: The display name of the custom role
    example: 'Support agent'
  description:
    type: string
    maxLength: 1000
    description: The purpose of the custom role
    example: 'Handles unassigned conversations in assigned inboxes'
  permissions:
    type: array
    minItems: 1
    uniqueItems: true
    description: Permission keys granted to agents holding this role
    items:
      type: string
      enum:
        - conversation_manage
        - conversation_unassigned_manage
        - conversation_participating_manage
        - contact_manage
        - report_manage
        - knowledge_base_manage
    example: ['conversation_unassigned_manage']
